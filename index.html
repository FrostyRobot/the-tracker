<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="tracker" />
<meta name="theme-color" content="#f7ebe4" />
<title>tracker</title>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow-x:hidden; }
  body {
    --ink:#26281f; --muted:#7c7d6e; --faint:#a9a99a;
    --paper:#f7ebe4; --panel:#fcf4ef; --line:#ecddd1;
    --moss:#d97757; --moss-soft:#f3ddd1;
    --teal:#3d7a86; --teal-soft:#cfe0e2;
    --amber:#bd7a2c;
    --dead:#e0842a; --dead-soft:#f9e3ca;
    --done:#3f8a52; --done-soft:#d9ecdf;
    --onday:#8267ba; --onday-soft:#f1ecf8;
    --xred:#cf4a3f;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  .wrap {
    min-height:100%;
    padding:calc(22px + env(safe-area-inset-top)) 12px calc(34px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  /* iPhone 16 Pro Max: scale the UI up, centered, with a symmetric side gutter */
  .board { width:100%; max-width:400px; margin:0 auto; zoom:1.04; }
  .serif { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .weeknav { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .wkbtn { width:44px; height:44px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; }
  .wkbtn:hover { border-color:#cfc9b6; }
  .wkbtn:active { transform:scale(.92); }
  .wkcenter { flex:1 1 auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .wkrange { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight:600; font-size:19px; line-height:1; }
  .wkstart { font-family:inherit; font-size:14px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:3px 7px; }
  .wkt { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight:600; font-size:18px; }

  .strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; }
  /* framed week; Sunday view adds dividers Sun-Tue | Wed-Fri | Sat */
  .strip.boxed { gap:5px; border:2px solid var(--muted); border-radius:14px; padding:8px; }
  .strip.divided { grid-template-columns:1fr 1fr 1fr auto 1fr 1fr 1fr auto 1fr; }
  .daydiv { width:2px; align-self:stretch; background:var(--muted); border-radius:1px; margin:3px 0; }
  .day { border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:11px 3px; text-align:center; cursor:pointer; transition:background .12s,border-color .12s; position:relative; }
  .day:hover { border-color:#cfc9b6; }
  .day.sel { background:var(--ink); border-color:var(--ink); }
  .day.sel .dow { color:var(--panel); }
  .dow { font-size:17px; font-weight:600; color:var(--ink); }
  .dnum { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:16px; font-weight:600; margin-top:3px; line-height:1; color:var(--muted); }
  .day.sel .dnum { color:var(--paper); }
  .todot { width:4px; height:4px; border-radius:50%; background:var(--moss); position:absolute; top:6px; right:6px; }
  .day.sel .todot { background:var(--moss-soft); }
  .day.off { background:var(--dead-soft); border-color:#edcca1; }
  .day.off .dow, .day.off .dnum { color:var(--ink); }
  .day.sel.off { border-color:var(--dead); }
  .day.off .todot { background:var(--dead); }
  .day.done { background:var(--done-soft); border-color:#b3d6c0; }
  .day.done .dow, .day.done .dnum { color:var(--ink); }
  .day.sel.done { border-color:var(--done); }
  .day.done .todot { background:var(--done); }
  .day.on { background:var(--onday-soft); border-color:#d0c3e6; }
  .day.on .dow, .day.on .dnum { color:var(--ink); }
  .day.sel.on { border-color:var(--onday); }
  .day.on .todot { background:var(--onday); }
  /* selected day always reads as selected (dark), whatever its off/on/complete state; the state shows as the border */
  .day.sel.off, .day.sel.on, .day.sel.done { background:var(--ink); }
  .day.sel.off .dow, .day.sel.on .dow, .day.sel.done .dow { color:var(--panel); }
  .day.sel.off .dnum, .day.sel.on .dnum, .day.sel.done .dnum { color:var(--paper); }

  .dayhead { display:flex; align-items:center; gap:14px; margin:2px 0 12px; }
  .dhleft { flex:1 1 0; min-width:0; }
  .dhright { flex:1 1 0; min-width:0; }
  .dhtitle { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight:600; font-size:19px; }

  .cols { display:flex; gap:14px; align-items:flex-start; }
  .side { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .side.left { flex:1 1 0; }
  .side.right { flex:1 1 0; }
  .panel { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:2px 12px; width:100%; }
  .panel.left { }
  .panel.right { }
  .panel.purple { background:#f1ecf8; border-color:#ddd3ea; }
  .dayflags { display:flex; gap:6px; justify-content:flex-end; }
  .flagtoggle { font-family:inherit; font-size:14px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
  .flagtoggle:active { transform:scale(.96); }
  .flagtoggle.on.complete { background:var(--done); border-color:var(--done); color:#fff; }
  .flagtoggle.on.off { background:var(--dead); border-color:var(--dead); color:var(--ink); }
  .flagtoggle.on.onday { background:var(--onday); border-color:var(--onday); color:#fff; }
  .hitem { padding:7px 2px; border-bottom:1px solid var(--line); }
  .hitem:last-child { border-bottom:none; }
  .hitem.shade { background:#f8e1c9; margin-left:-12px; margin-right:-12px; padding-left:14px; padding-right:14px; }
  .hitem.ptint { background:#f1ecf8; margin-left:-12px; margin-right:-12px; padding-left:14px; padding-right:14px; }
  .hrow { display:flex; align-items:center; gap:12px; }
  .hrow.tap { cursor:pointer; }
  .hkey { flex:0 0 42px; font-weight:600; font-size:16px; color:var(--ink); }
  .tagbox { flex:1 1 auto; min-width:0; font-family:inherit; font-size:16px; color:#000; background:#fff; border:1px solid var(--line); border-radius:6px; padding:3px 7px; }
  .tagbox:focus { outline:none; }
  .tagkey { flex:0 0 auto; }
  .timebox { flex:0 0 auto; width:80px; box-sizing:border-box; height:28px; font-family:inherit; font-size:15px; color:#000; background:#fff; border:1px solid var(--line); border-radius:5px; padding:0 4px; }
  .timebox:focus { outline:none; }
  .chev { margin-left:-4px; color:var(--faint); display:inline-flex; transition:transform .15s ease; }
  .chev.open { transform:rotate(90deg); }

  /* check toggle */
  .htoggle { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; color:var(--ink);
    background:none; border:none; padding:2px; cursor:pointer; }
  .htoggle:active { transform:scale(.9); }
  .htoggle .box { width:19px; height:19px; border-radius:5px; border:1.5px solid var(--faint); display:grid; place-items:center; }
  .htoggle .box.yes { border-color:var(--done); background:var(--done); color:#fff; }
  .htoggle .box.no { border-color:var(--xred); background:var(--xred); color:#fff; }

  /* measure input */
  .measure { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; }
  .mbox { width:80px; height:28px; box-sizing:border-box; font-family:inherit; font-weight:400; font-size:16px; line-height:1; color:#000;
    background:#fff; border:1px solid var(--line); border-radius:5px; padding:0 5px; text-align:center; }
  .mbox:focus { outline:none; }

  /* meal panel (right column) — time + occurred check + optional whey check */
  .panel.mealpanel { padding:2px 8px; }
  .mealrow { display:flex; align-items:center; width:100%; }
  .mealrow > .hkey { flex:0 0 34px; }
  .mealtime { flex:0 0 80px; width:80px; margin-left:4px; box-sizing:border-box; height:30px; font-family:inherit; font-size:15px; color:#000; background:#fff; border:1px solid var(--line); border-radius:6px; padding:0 4px; }
  .mealtime:focus { outline:none; }
  .mealtime.filled { background:var(--done-soft); border-color:#8ec6a2; }
  .exleft { flex:0 0 auto; margin-left:8px; display:flex; align-items:center; justify-content:center; }
  .mchks { margin-left:auto; display:flex; align-items:center; gap:5px; }
  .mslot { flex:0 0 24px; display:flex; align-items:center; justify-content:center; }
  .exdh { display:flex; align-items:center; font-weight:600; font-size:13px; color:var(--ink); }
  .whlbl { display:flex; align-items:center; font-weight:600; font-size:16px; color:var(--ink); }
  .donelbl { font-size:13px; }
  .countval { font-weight:700; font-size:16px; color:var(--ink); margin-left:6px; }
  .mchk { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; padding:1px; cursor:pointer; }
  .mchk:active { transform:scale(.9); }
  .mchk .box { width:22px; height:22px; border-radius:5px; border:1.5px solid var(--faint); display:grid; place-items:center; }
  .mchk .box.yes { border-color:var(--done); background:var(--done); color:#fff; }
  .mchk .box.no { border-color:var(--xred); background:var(--xred); color:#fff; }
  .mchk.whey .box.w1 { border-color:#2f6fed; background:#2f6fed; color:#fff; }
  .mchk.whey .box.w2 { border-color:var(--xred); background:var(--xred); color:#fff; }
  /* multi-step meal check (M1-M5): 1 light green ... 8 deep scarlet */
  .mchk .box.mstep { font-weight:700; font-size:12px; }
  .mchk .box.mstep.s1 { border-color:#7cc47f; background:#7cc47f; color:#fff; }
  .mchk .box.mstep.s2 { border-color:#62b56a; background:#62b56a; color:#fff; }
  .mchk .box.mstep.s3 { border-color:#8fb84a; background:#8fb84a; color:#fff; }
  .mchk .box.mstep.s4 { border-color:#b9ad38; background:#b9ad38; color:#fff; }
  .mchk .box.mstep.s5 { border-color:#d99a2c; background:#d99a2c; color:#fff; }
  .mchk .box.mstep.s6 { border-color:#de7826; background:#de7826; color:#fff; }
  .mchk .box.mstep.s7 { border-color:#d64f2e; background:#d64f2e; color:#fff; }
  .mchk .box.mstep.s8 { border-color:#cf1810; background:#cf1810; color:#fff; }
  .mchk .box.mstep.s9 { border-color:#1c1c1c; background:#1c1c1c; color:#fff; }
  /* EXE step scale: 0 red, 1 light red, 2 orange, 3 light green, 4 green, 5 dark green, 6 light purple, 7 purple, 8 dark purple, 9 gold */
  .mchk .box.estep { font-weight:700; font-size:12px; }
  .mchk .box.estep.e0 { border-color:#cf4a3f; background:#cf4a3f; color:#fff; }
  .mchk .box.estep.e1 { border-color:#e0897d; background:#e0897d; color:#fff; }
  .mchk .box.estep.e2 { border-color:var(--dead); background:var(--dead); color:#fff; }
  .mchk .box.estep.e3 { border-color:#6bbd77; background:#6bbd77; color:#fff; }
  .mchk .box.estep.e4 { border-color:var(--done); background:var(--done); color:#fff; }
  .mchk .box.estep.e5 { border-color:#276b3c; background:#276b3c; color:#fff; }
  .mchk .box.estep.e6 { border-color:#ac93d4; background:#ac93d4; color:#fff; }
  .mchk .box.estep.e7 { border-color:var(--onday); background:var(--onday); color:#fff; }
  .mchk .box.estep.e8 { border-color:#5d3a9a; background:#5d3a9a; color:#fff; }
  .mchk .box.estep.e9 { border-color:#d0a828; background:#d0a828; color:#fff; }

  /* WH counter colours: 0 red, 1 light green, 2 green, 3 light purple, 4 purple, 5-6 gold */
  .mchk .box.wstep { font-weight:700; font-size:12px; }
  .mchk .box.wstep.wv0 { border-color:#cf4a3f; background:#cf4a3f; color:#fff; }
  .mchk .box.wstep.wv1 { border-color:#6bbd77; background:#6bbd77; color:#fff; }
  .mchk .box.wstep.wv2 { border-color:var(--done); background:var(--done); color:#fff; }
  .mchk .box.wstep.wv3 { border-color:#ac93d4; background:#ac93d4; color:#fff; }
  .mchk .box.wstep.wv4 { border-color:var(--onday); background:var(--onday); color:#fff; }
  .mchk .box.wstep.wv5 { border-color:#d0a828; background:#d0a828; color:#fff; }
  .mchk .box.wstep.wv6 { border-color:#d0a828; background:#d0a828; color:#fff; }
  .mlabel { flex:0 0 auto; font-weight:600; font-size:13px; color:var(--ink); }

  /* subset panel: running Count + editable per-week target */
  .subsetpanel { padding:2px 12px; }
  .subsettitle { font-weight:600; font-size:15px; color:var(--ink); padding:9px 2px 3px; }
  .subsetpanel .mealrow { justify-content:space-between; }
  .subsetpanel .mealrow > .hkey { flex:0 0 auto; font-size:16px; }
  .subsetpanel .countval { margin-left:auto; }
  .subsetnote { font-size:14px; color:var(--muted); }
  .tgtbox { margin-left:auto; width:80px; height:28px; box-sizing:border-box; font-family:inherit; font-size:16px; color:#000; background:#fff; border:1px solid var(--line); border-radius:5px; padding:0 5px; text-align:center; }
  .tgtbox:focus { outline:none; }

  /* routine steps */
  .steps { margin-top:6px; margin-left:58px; display:flex; flex-direction:column; gap:0; }
  .step { display:flex; align-items:center; gap:11px; padding:5px 2px; cursor:pointer; }
  .stepcheck { width:19px; height:19px; border-radius:5px; border:1.5px solid var(--faint); display:grid; place-items:center; flex:0 0 auto; }
  .step.on .stepcheck { border-color:var(--done); background:var(--done); color:#fff; }
  .stepname { font-size:16px; color:var(--ink); }
  .step.on .stepname { color:var(--muted); text-decoration:line-through; }
  .step.shade { background:#f8e1c9; margin-right:-12px; padding-right:12px; border-radius:4px 0 0 4px; }

  .foot { display:flex; align-items:center; justify-content:flex-start; gap:2px; flex-wrap:wrap; width:100%; margin:22px 0 0; }
  .reset { display:inline-flex; align-items:center; gap:5px; font-size:14.5px; color:var(--ink); background:none; border:none; cursor:pointer; padding:6px; }
  .reset:hover { color:var(--ink); }

  .datapanel { margin-top:14px; border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:16px; }
  .dtitle { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight:600; font-size:15px; margin-bottom:12px; }
  .dbtns { display:flex; flex-wrap:wrap; gap:8px; }
  .dbtns button { flex:1 1 auto; font-family:inherit; font-size:12.5px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px 10px; cursor:pointer; }
  .dbtns button:hover { border-color:#cfc9b6; }
  .dout { margin-top:10px; }
  .dta { width:100%; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px;
    color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:9px; resize:vertical; line-height:1.4; }
  .dcopy { margin-top:8px; display:inline-flex; align-items:center; gap:5px; font-family:inherit;
    font-size:12.5px; color:var(--panel); background:var(--ink); border:1px solid var(--ink); border-radius:9px; padding:8px 12px; cursor:pointer; }
  .dcopy:disabled { opacity:.4; cursor:default; }
  .doutbtns { display:flex; gap:8px; margin-top:8px; }
  .doutbtns .dcopy { margin-top:0; }
  .dcopy.ghost { background:var(--paper); color:var(--ink); border-color:var(--line); }
  .dsep { margin:16px 0 8px; font-size:12px; color:var(--ink); }
  .dmsg { margin-top:10px; font-size:12px; color:var(--ink); line-height:1.45; min-height:1em; }

  @media (prefers-reduced-motion: reduce) { .day,.chev { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div id="main"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     HABITS — every tracked item, keyed uniquely.
       type "check"    -> tap cycles blank / yes / no
       type "measure"  -> a logged value (free text)
       type "time"     -> a time value
       type "tags"     -> free-text tags
       type "routine"  -> a manual check + a checklist (steps)
       type "mealrow" / "mealexe" / "mealdone" -> meal panel widgets
     LAYOUT — which panel each key sits in, and in what order.
     ============================================================ */
  var HABITS = [
    // LHS — habits & routines
    { key: "RT", label: "RT", type: "check" },
    { key: "CS", label: "CS", type: "routine", steps: [{ label: "Weight", shade: true },{ label: "Stretch", shade: true },"Teeth", "Shave", "Skin"] },
    { key: "TR", label: "TR", type: "check", tint: "ptint" },
    { key: "PM", label: "PM", type: "check", tint: "ptint" },
    { key: "CE", label: "CE", type: "routine", steps: [{ label: "All Dishes", shade: true }, "Teeth", "Skin", "Set Alarm", "Set ProP"] },
    // RHS — values
    { key: "LO", label: "LO", type: "time" },
    { key: "RT-A", label: "RT-A", type: "time" },
    { key: "MHR", label: "MHR", type: "measure", numeric: "numeric" },
    { key: "TR-P", label: "TR-P", type: "measure" },
    { key: "TR-A", label: "TR-A", type: "measure" },
    { key: "A", label: "A", type: "tags" },
    // Meal tracker (RHS purple panel)
    { key: "M1", label: "M1", type: "mealrow", whey: "M1-W" },
    { key: "M2", label: "M2", type: "mealrow", whey: "M2-W" },
    { key: "M3", label: "M3", type: "mealrow", whey: "M3-W" },
    { key: "M4", label: "M4", type: "mealrow", whey: "M4-W" },
    { key: "M5", label: "M5", type: "mealrow", whey: "M5-W" },
    { key: "EXE", label: "EXE", type: "mealexe" },
    // exported-but-not-directly-placed meal sub-values
    { key: "M1-T", label: "M1-T", type: "time", meta: true },
    { key: "M2-T", label: "M2-T", type: "time", meta: true },
    { key: "M3-T", label: "M3-T", type: "time", meta: true },
    { key: "M4-T", label: "M4-T", type: "time", meta: true },
    { key: "M5-T", label: "M5-T", type: "time", meta: true },
    { key: "M1-W", label: "M1-W", type: "check", meta: true },
    { key: "M2-W", label: "M2-W", type: "check", meta: true },
    { key: "M3-W", label: "M3-W", type: "check", meta: true },
    { key: "M4-W", label: "M4-W", type: "check", meta: true },
    { key: "M5-W", label: "M5-W", type: "check", meta: true },
    { key: "WH", label: "WH", type: "mealexe", meta: true },
    { key: "DONE", label: "DONE", type: "mealdone", meta: true },
    // per-week Count targets: the two 3-day subsets (Sun-Tue = A, Wed-Fri = B) and the whole-week limit (M view)
    { key: "TGT-A", label: "TGT-A", type: "measure", scope: "week", meta: true },
    { key: "TGT-B", label: "TGT-B", type: "measure", scope: "week", meta: true },
    { key: "TGT-W", label: "TGT-W", type: "measure", scope: "week", meta: true }
  ];

  var LAYOUT = {
    left: [
      { keys: ["LO","RT-A", "MHR"] },
      { keys: ["RT", "CS", "TR", "PM", "CE"] },
      { keys: ["TR-P","TR-A"] }
    ],
    right: [
      { keys: ["M1", "M2", "M3", "M4", "M5", "EXE", "A", "DONE"], tone: "purple mealpanel" },
    ]
  };

  var byKey = {};
  HABITS.forEach(function (h) { byKey[h.key] = h; });
  var DAY_HABITS = HABITS.filter(function (h) { return h.scope !== "week"; });
  var WEEK_HABITS = HABITS.filter(function (h) { return h.scope === "week"; });
  var TOTAL = HABITS.length;
  var LS = window.localStorage;

  /* ---------- icons ---------- */
  function svg(size, inner, sw) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  var ICON = {
    chevL: svg(20, '<polyline points="15 18 9 12 15 6"/>', 2.2),
    chevR: svg(20, '<polyline points="9 18 15 12 9 6"/>', 2.2),
    chev:  svg(17, '<polyline points="9 18 15 12 9 6"/>', 2.2),
    check: svg(14, '<polyline points="20 6 9 17 4 12"/>', 2.5),
    x:     svg(14, '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 2.5),
    minus: svg(15, '<line x1="5" y1="12" x2="19" y2="12"/>', 2.2),

  }
  function toggleData() {
    var p = document.getElementById("datapanel");
    p.style.display = (p.style.display === "none" ? "block" : "none");
    setMsg("");
  }
  function quickSave() {
    var text = JSON.stringify(collectWeek(), null, 2);
    var fname = "tracker-" + toKey(state.weekStart) + ".json";
    if (navigator.share) {
      try {
        if (navigator.canShare) {
          var file = new File([text], fname, { type: "application/json" });
          if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: "tracker backup" }).catch(function () {}); return; }
        }
        navigator.share({ title: "tracker backup", text: text }).catch(function () {});
        return;
      } catch (e) { return; }
    }
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {}
  }
  function copyOut() {
    var ta = document.getElementById("dp-out");
    ta.focus(); ta.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () { setMsg("Copied to clipboard."); })
        .catch(function () { setMsg("Couldn\u2019t copy automatically \u2014 tap the text, Select All, then Copy."); });
    } else { setMsg("Tap the text above, choose Select All, then Copy."); }
  }
  function shareOut() {
    var text = document.getElementById("dp-out").value;
    if (!text) return;
    try {
      if (navigator.canShare) {
        var file = new File([text], "tracker-" + toKey(state.weekStart) + ".json", { type: "application/json" });
        if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: "tracker backup" }).then(function () { setMsg("Shared \u2014 save it somewhere safe."); }).catch(function () {}); return; }
      }
      if (navigator.share) { navigator.share({ title: "tracker backup", text: text }).then(function () { setMsg("Shared \u2014 save it somewhere safe."); }).catch(function () {}); }
      else setMsg("Sharing isn\u2019t available here \u2014 use Copy instead.");
    } catch (e) { setMsg("Sharing isn\u2019t available here \u2014 use Copy instead."); }
  }
  function doRestore() {
    var v = document.getElementById("dp-in").value;
    try {
      var parsed = JSON.parse(v), n = 0, days = parsed.days || {};
      Object.keys(days).forEach(function (date) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(date)) { saveDayLS(date, normalizeDay(days[date])); n++; }
      });
      if (parsed.week && typeof parsed.week === "object" && typeof parsed.weekStart === "string" && /^\d{4}-\d{2}-\d{2}$/.test(parsed.weekStart)) {
        saveWeekLS(parsed.weekStart, normalizeWeek(parsed.week));
      }
      loadWeek(state.weekStart);
      document.getElementById("dp-in").value = "";
      setMsg("Restored " + n + " day" + (n === 1 ? "" : "s") + " of data.");
    } catch (e) {
      setMsg("That didn\u2019t read as valid data. Paste the whole JSON you exported.");
    }
  }

  /* ---------- events ---------- */
  function blueWheyCount(data) {
    var c = 0;
    ["M1-W", "M2-W", "M3-W", "M4-W", "M5-W"].forEach(function (k) { if (Number(data && data[k]) === 1) c++; });
    return c;
  }
  // a single day's meal Count = sum of M1..M5 (1-9) minus the EXE number
  function dayCount(data) {
    var mealSum = 0;
    ["M1", "M2", "M3", "M4", "M5"].forEach(function (k) { var x = Number(data && data[k]); if (x >= 1 && x <= 9) mealSum += x; });
    var exeN = (data && typeof data["EXE"] === "number") ? data["EXE"] : 0;
    return mealSum - exeN;
  }
  // which group a date belongs to: "A" (Sun-Tue), "B" (Wed-Fri), or "SAT" (its own 1-day group)
  function subsetOf(date) { var dw = date.getDay(); return dw <= 2 ? "A" : (dw <= 5 ? "B" : "SAT"); }

  function onClick(e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var a = el.getAttribute("data-action");
    var key = el.getAttribute("data-key");

    if (a === "selday") { state.selected = key; renderMain(); }
    else if (a === "prevweek") { goToWeek(addDays(state.weekStart, -7)); }
    else if (a === "nextweek") { goToWeek(addDays(state.weekStart, 7)); }
    else if (a === "thisweek") { goToWeek(weekStartOf(new Date(), state.weekStartDay)); }
    else if (a === "togglewkstart") {
      var nsd = state.weekStartDay === 1 ? 0 : 1;
      state.weekStartDay = nsd;
      try { LS.setItem("weekStartDay", String(nsd)); } catch (e) {}
      var cur = selDay();
      var anchor = cur ? cur.date : new Date();
      var keep = state.selected;
      state.weekStart = weekStartOf(anchor, nsd);
      state.days = daysFrom(state.weekStart).map(function (date) { var k = toKey(date); return { key: k, date: date, data: loadDayLS(k) }; });
      state.weekData = loadWeekLS(toKey(state.weekStart));
      state.selected = state.days.some(function (x) { return x.key === keep; }) ? keep
        : (state.days.some(function (x) { return x.key === state.todayKey; }) ? state.todayKey : state.days[0].key);
      renderMain();
    }
    else if (a === "check") {
      withDay(function (data) { data[key] = (Number(data[key]) + 1) % 3; });
      renderMain();
    }
    else if (a === "mstep") {
      withDay(function (data) {
        var nv = (Number(data[key]) + 1) % 10;
        data[key] = nv;
        if (nv === 0) data[key + "-T"] = ""; // cycled back to no value -> clear the time
      });
      renderMain();
    }
    else if (a === "estep") {
      if (key === "WH") {
        withDay(function (data) {
          var blue = blueWheyCount(data);
          var touched = (typeof data["WH"] === "number");
          // current shown value (-1 = empty)
          var curShown = !touched ? (blue === 0 ? -1 : blue) : Math.min(6, blue + Math.max(0, data["WH"]));
          var nextShown;
          if (curShown < 0) nextShown = 0;        // empty -> 0
          else if (curShown >= 6) nextShown = -1; // wrap 6 -> empty (falls back to floor if blue > 0)
          else nextShown = curShown + 1;
          if (nextShown < 0) delete data["WH"];   // untouched: shown tracks floor live
          else data["WH"] = Math.max(0, nextShown - blue); // store extra above floor
        });
      } else {
        withDay(function (data) { var cur = data[key]; data[key] = (typeof cur !== "number") ? 0 : (cur >= 9 ? "" : cur + 1); });
      }
      renderMain();
    }
    else if (a === "rdone") {
      withDay(function (data) {
        var cur = shallow(data[key]);
        var nx = ((Number(cur.done) || 0) + 1) % 3;
        if (nx === 0) delete cur.done; else cur.done = nx;
        data[key] = cur;
      });
      renderMain();
    }
    else if (a === "ropen") { state.open[key] = !state.open[key]; renderMain(); }
    else if (a === "markoff") { markDayType("off"); renderMain(); }
    else if (a === "markon") { markDayType("on"); renderMain(); }
    else if (a === "markcomplete") { markComplete(); renderMain(); }
    else if (a === "step") {
      var idx = el.getAttribute("data-idx");
      withDay(function (data) {
        var cur = shallow(data[key]);
        if (cur[idx]) delete cur[idx]; else cur[idx] = true;
        data[key] = cur;
      });
      renderMain();
    }
    else if (a === "reset") {
      if (window.confirm("Clear all entries for this week? This can't be undone.")) {
        state.days.forEach(function (d) { delDayLS(d.key); d.data = emptyDay(); });
        delWeekLS(toKey(state.weekStart)); state.weekData = emptyWeek();
        renderMain();
      }
    }
    else if (a === "resetday") {
      if (window.confirm("Clear all entries for this day? This can't be undone.")) {
        var rd = selDay();
        if (rd) { delDayLS(rd.key); rd.data = emptyDay(); }
        renderMain();
      }
    }
    else if (a === "resettimes") {
      if (window.confirm("Clear the time fields for this day?")) {
        var rt = selDay();
        if (rt) {
          var tdata = cloneDay(rt.data);
          DAY_HABITS.forEach(function (h) { if (h.type === "time") tdata[h.key] = ""; });
          rt.data = tdata; saveDayLS(rt.key, tdata);
        }
        renderMain();
      }
    }
    else if (a === "quicksave") { quickSave(); }
  }

  function onChange(e) {
    var t = e.target;
    var st = t.closest ? t.closest('[data-action="setstart"]') : null;
    if (st && st.value) { var p = st.value.split("-"); goToWeek(weekStartOf(new Date(+p[0], +p[1] - 1, +p[2]), state.weekStartDay)); return; }
    var mb = t.closest ? t.closest('[data-action="measure"]') : null;
    if (mb) {
      // Save on blur/change only; don't re-render so we don't fight the input focus.
      var d = selDay();
      if (d) { d.data[mb.getAttribute("data-key")] = mb.value; saveDayLS(d.key, d.data); }
      return;
    }
    var wm = t.closest ? t.closest('[data-action="weekmeasure"]') : null;
    if (wm) {
      var data = cloneWeek(state.weekData);
      data[wm.getAttribute("data-key")] = wm.value;
      state.weekData = data;
      saveWeekLS(toKey(state.weekStart), data);
      return;
    }
  }

  /* ---------- home-screen icon (generated, no extra files) ---------- */
  function makeIcon() {
    try {
      var c = document.createElement("canvas"); c.width = 180; c.height = 180;
      var x = c.getContext("2d"), r = 40;
      x.fillStyle = "#d97757";
      x.beginPath();
      x.moveTo(r, 0); x.arcTo(180, 0, 180, 180, r); x.arcTo(180, 180, 0, 180, r);
      x.arcTo(0, 180, 0, 0, r); x.arcTo(0, 0, 180, 0, r); x.closePath(); x.fill();
      x.fillStyle = "#f7ebe4";
      x.font = '700 84px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText("PR", 90, 100);
      var url = c.toDataURL("image/png");
      var apple = document.createElement("link"); apple.rel = "apple-touch-icon"; apple.href = url; document.head.appendChild(apple);
      var fav = document.createElement("link"); fav.rel = "icon"; fav.href = url; document.head.appendChild(fav);
    } catch (e) {}
  }

  /* ---------- init ---------- */
  document.body.addEventListener("click", onClick);
  document.body.addEventListener("change", onChange);
  makeIcon();
  state.todayKey = toKey(new Date());
  loadWeek(weekStartOf(new Date(), state.weekStartDay));
})();
</script>
</body>
